   height="256"
   version="1.1"
   id="svg15"
   sodipodi:docname="Scrap.svg"
   inkscape:version="1.3.2 (091e20e, 2023-11-25, custom)"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <defs
     id="defs15" />
  <sodipodi:namedview
     id="namedview15"
     pagecolor="#ffffff"
     bordercolor="#000000"
     borderopacity="0.25"
     inkscape:showpageshadow="2"
     inkscape:pageopacity="0.0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#d1d1d1"
     inkscape:zoom="1.529371"
     inkscape:cx="102.98352"
     inkscape:cy="74.213519"
     inkscape:window-width="1920"
     inkscape:window-height="974"
     inkscape:window-x="-11"
     inkscape:window-y="-11"
     inkscape:window-maximized="1"
     inkscape:current-layer="svg15" />
  <!-- Main Group with thick comic-style outlines (Inkscape Editable) -->
  <g
     id="Space_Scrap_Pile"
     stroke="#000000"
     stroke-width="4"
     stroke-linejoin="round"
     stroke-linecap="round"
     transform="matrix(0.76198261,0,0,0.76198261,-7.2519168,8.4427914)">
    <!-- Background Rods / Antenna Spikes -->
    <g
       id="Antenna_Rods">
      <path
         fill="#a4b0be"
         d="m 156.19804,80.594599 20,-40 10,5 -20,45 z"
         id="path1" />
      <path
         fill="#718093"
         d="m 196.19804,70.594599 20,-40 10,5 -20,40 z"
         id="path2" />
      <rect
         x="220"
         y="80"
         width="60"
         height="20"
         rx="5"
         transform="rotate(25,220,80)"
         fill="#576574"
         id="rect2" />
    </g>
    <!-- Broken Solar Panel / Tech Fragment (Right) -->
    <g
       id="Solar_Fragment"
       fill="#0984e3">
      <path
         d="m 200,140 80,-20 15,60 -80,20 z"
         id="path3" />
      <!-- Internal grid lines for solar cells -->
      <path
         stroke="#000000"
         stroke-width="2"
         fill="none"
         d="m 220,135 15,55 m 10,-60 15,55 m -50,-30 75,-20 m -70,40 75,-20"
         id="path4" />
    </g>
    <!-- Main Structural I-Beam (Slanted Left) -->
    <g
       id="Structural_Beam">
      <path
         fill="#576574"
         d="m 60,130 90,-40 20,55 -90,40 z"
         id="path5" />
      <!-- Beam thickness / flange -->
      <path
         fill="#3b3b3b"
         d="m 80,185 90,-40 -5,15 -90,40 z"
         id="path6" />
      <circle
         cx="100"
         cy="150"
         r="4"
         fill="#a4b0be"
         id="circle6" />
      <circle
         cx="130"
         cy="135"
         r="4"
         fill="#a4b0be"
         id="circle7" />
    </g>
    <!-- Heavy Foreground Pipe / Fuel Tank -->
    <g
       id="Main_Pipe">
      <!-- Pipe Body -->
      <path
         fill="#a4b0be"
         d="m 100,180 160,-20 10,60 -160,20 z"
         id="path7" />
      <!-- Orange hazard reinforcement band -->
      <path
         fill="#e85d04"
         d="m 180,171 15,-2 5,50 -15,2 z"
         id="path8" />
      <!-- Hollow open pipe end (Left) -->
      <ellipse
         cx="105"
         cy="210"
         rx="10"
         ry="25"
         fill="#222f3e"
         id="ellipse8" />
      <path
         fill="#718093"
         d="m 95,185 h 10 v 50 H 95 Z"
         id="path9" />
    </g>
    <!-- Bottom Engine / Hull Block -->
    <g
       id="Engine_Block">
      <path
         fill="#636e72"
         d="M 120,210 230,200 210,280 100,270 Z"
         id="path10" />
      <!-- Dark exhaust vent -->
      <path
         fill="#2d3436"
         d="m 150,230 40,-5 -5,40 -40,5 z"
         id="path11" />
      <!-- Orange stripe accent -->
      <path
         fill="#e85d04"
         d="m 115,225 15,-2 -5,32 -15,2 z"
         id="path12" />
    </g>
    <!-- Loose Wires & Floating Shards -->
    <g
       id="Wires_And_Shards"
       fill="none"
       stroke-width="4">
      <path
         stroke="#ff4757"
         d="m 80,210 q -20,40 10,60 30,20 40,20"
         id="path13" />
      <path
         stroke="#222f3e"
         d="m 230,190 q 30,20 10,50"
         id="path14" />
      <!-- Floating metallic shard piece -->
      <path
         fill="#b2bec3"
         stroke="#000000"
         stroke-width="3"
         d="m 250,90 40,10 -10,30 -40,-10 z"
         id="path15" />
    </g>
